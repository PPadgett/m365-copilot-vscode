name: Temporary Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: temporary-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.head_ref == 'security/fail-closed-scorecard-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create source snapshot
        run: tar --exclude=.git -czf "$RUNNER_TEMP/source-snapshot.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temporary-source-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
