name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    if: github.repository == 'PPadgett/m365-copilot-vscode'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run release quality gates
        run: npm run verify

      - name: Audit build dependencies
        run: npm audit --audit-level=moderate

      - name: Build VSIX
        run: npm run package

      - name: Validate VSIX package semantics
        run: npm run validate:vsix

      - name: Verify reproducible packaging
        run: npm run reproducible

      - name: Enforce performance and artifact-size budgets
        run: npm run performance

      - name: Run packaged extension smoke test
        run: npm run smoke:vsix

      - name: Validate VSIX ZIP structure
        run: unzip -t artifacts/*.vsix

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Validate CycloneDX SBOM
        run: npm run validate:sbom

      - name: Resolve SBOM path
        id: sbom
        shell: bash
        run: |
          files=(artifacts/*.cdx.json)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          printf 'path=%s\n' "${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.vsix

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.vsix
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/*
          --verify-tag
          --generate-notes
          --prerelease
          --title "$RELEASE_TAG"
