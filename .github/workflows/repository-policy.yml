name: Repository Policy

on:
  branch_protection_rule:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Require repository administration-read evidence token
        env:
          REPOSITORY_POLICY_TOKEN: ${{ secrets.REPOSITORY_POLICY_TOKEN }}
        run: |
          if [ -z "$REPOSITORY_POLICY_TOKEN" ]; then
            echo "::error::Configure REPOSITORY_POLICY_TOKEN as a repository-scoped fine-grained token with Administration: read."
            exit 1
          fi

      - name: Audit live GitHub settings against committed policy
        env:
          GITHUB_TOKEN: ${{ secrets.REPOSITORY_POLICY_TOKEN }}
          GITHUB_DEFAULT_BRANCH: main
        run: npm run repository:audit -- "${{ github.repository }}"
