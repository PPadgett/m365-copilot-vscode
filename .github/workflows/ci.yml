name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate GitHub Actions and embedded shell
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          pyflakes: false
          shellcheck: true

  static_quality:
    name: Static Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate repository and documentation policy
        run: npm run check

      - name: Run source and security lint
        run: npm run lint

      - name: Validate advanced QA pipeline policy
        run: npm run quality:policy

      - name: Compile with strict TypeScript settings
        run: npm run compile

      - name: Audit build dependencies
        run: npm audit --audit-level=moderate

  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          check-latest: true

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build test target
        run: npm run build

      - name: Run unit, functional, regression, and activation smoke tests
        env:
          TEST_REPORT_DIR: artifacts/quality/node-${{ matrix.node }}
        run: node scripts/run-tests.mjs unit

      - name: Publish unit quality summary
        run: node scripts/summarize-quality.mjs artifacts/quality/node-${{ matrix.node }} unit

      - name: Run mocked Graph integration and API contract tests
        env:
          TEST_REPORT_DIR: artifacts/quality/node-${{ matrix.node }}
        run: node scripts/run-tests.mjs integration

      - name: Publish integration quality summary
        run: node scripts/summarize-quality.mjs artifacts/quality/node-${{ matrix.node }} integration

      - name: Upload test, JUnit, and LCOV evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-node-${{ matrix.node }}-${{ github.sha }}
          path: artifacts/quality/node-${{ matrix.node }}/
          if-no-files-found: error
          retention-days: 21

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Initialize repository-owned CodeQL analysis
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript

      - name: Analyze without uploading to GitHub code scanning
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          upload: never
          output: codeql-results

      - name: Enforce zero unsuppressed CodeQL findings
        run: node scripts/check-codeql-sarif.mjs codeql-results

      - name: Upload repository-owned CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodeQL-SAST-${{ github.sha }}
          path: |
            codeql-results/
            codeql-policy-report.json
          if-no-files-found: warn
          retention-days: 21

  package:
    name: Package
    needs:
      - workflow_lint
      - static_quality
      - tests
      - sast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build VSIX
        run: npm run package

      - name: Validate VSIX package semantics
        run: npm run validate:vsix

      - name: Verify reproducible packaging
        run: npm run reproducible

      - name: Validate VSIX ZIP structure
        run: unzip -t artifacts/*.vsix

      - name: Enforce performance and artifact-size budgets
        run: npm run performance

      - name: Run packaged extension smoke test
        run: npm run smoke:vsix

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Validate CycloneDX SBOM
        run: npm run validate:sbom

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload immutable build and QA evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m365-copilot-vscode-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 21

  compatibility:
    name: Compatibility (${{ matrix.os }})
    needs:
      - package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
          - macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Download the exact packaged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m365-copilot-vscode-${{ github.sha }}
          path: artifacts

      - name: Validate installation layout and JavaScript syntax
        env:
          SMOKE_REPORT_DIR: artifacts/compatibility
        run: node scripts/smoke-vsix.mjs

      - name: Upload platform compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/compatibility/
          if-no-files-found: error
          retention-days: 21

  required:
    name: Required
    if: always()
    needs:
      - workflow_lint
      - static_quality
      - tests
      - sast
      - package
      - compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required CI and QA jobs
        env:
          WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
          STATIC_QUALITY_RESULT: ${{ needs.static_quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$WORKFLOW_LINT_RESULT" = "success"
          test "$STATIC_QUALITY_RESULT" = "success"
          test "$TESTS_RESULT" = "success"
          test "$SAST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
