name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify repository, compile, and test
        run: npm run verify

      - name: Audit build dependencies
        run: npm audit --audit-level=high

  sast:
    name: SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Initialize repository-owned CodeQL analysis
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript

      - name: Analyze without uploading to GitHub code scanning
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          upload: never
          output: codeql-results

      - name: Enforce zero unsuppressed CodeQL findings
        run: node scripts/check-codeql-sarif.mjs codeql-results

      - name: Upload repository-owned CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodeQL-SAST-${{ github.sha }}
          path: |
            codeql-results/
            codeql-policy-report.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          check-latest: true

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build VSIX
        run: npm run package

      - name: Validate VSIX package semantics
        run: npm run validate:vsix

      - name: Verify reproducible packaging
        run: npm run reproducible

      - name: Validate VSIX ZIP structure
        run: unzip -t artifacts/*.vsix

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Validate CycloneDX SBOM
        run: npm run validate:sbom

      - name: Generate SHA-256 checksums
        run: npm run checksums

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: m365-copilot-vscode-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: always()
    needs:
      - quality
      - sast
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required CI jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$SAST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
