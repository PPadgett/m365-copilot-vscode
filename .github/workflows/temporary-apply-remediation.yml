name: Temporary Apply Review Remediation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-apply-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'security/fail-closed-scorecard-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed remediation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/remediation-payload-*.part | base64 --decode | tar -xzf -
          rm -f .github/remediation-payload-*.part
          rm -f .github/workflows/temporary-source-snapshot.yml
          rm -f .github/workflows/temporary-apply-remediation.yml

      - name: Validate remediated security gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-repo.mjs
          node --test \
            test/gate-cli.test.cjs \
            test/repository-audit.test.cjs \
            test/repository-audit-timeout.test.cjs \
            test/scorecard-policy-cli.test.cjs \
            test/scorecard-policy.test.cjs \
            test/scorecard-sarif.test.cjs \
            test/scorecard-workflow-evidence.test.cjs

      - name: Commit and push remediated files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close remaining security gate gaps"
          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin "HEAD:$GITHUB_HEAD_REF"
