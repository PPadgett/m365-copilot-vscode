name: Extended QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          check-latest: true

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify the test suite kills security-control mutations
        run: npm run test:mutation

      - name: Upload mutation-testing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutation-testing-${{ github.sha }}
          path: artifacts/mutation/
          if-no-files-found: error
          retention-days: 3
