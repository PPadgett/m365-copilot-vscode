name: OpenSSF Scorecard

on:
  branch_protection_rule:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard Analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenSSF-Scorecard-${{ github.run_id }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 3

      - name: Upload Scorecard results to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif

  policy:
    name: Scorecard Policy
    if: always()
    needs:
      - analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate local Scorecard controls
        run: node scripts/check-repo.mjs

      - name: Download Scorecard artifact
        if: needs.analysis.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenSSF-Scorecard-${{ github.run_id }}

      - name: Evaluate Scorecard results against policy
        id: scorecard-policy
        if: needs.analysis.result == 'success'
        continue-on-error: true
        env:
          SCORECARD_POLICY_PROFILE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'repository' }}
        run: node scripts/check-scorecard-sarif.mjs results.sarif

      - name: Upload Scorecard policy report
        if: always() && needs.analysis.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: OpenSSF-Scorecard-Policy-${{ github.run_id }}
          path: scorecard-policy-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce Scorecard policy
        if: always()
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          POLICY_OUTCOME: ${{ steps.scorecard-policy.outcome }}
        run: |
          if [ "$ANALYSIS_RESULT" = "failure" ] || [ "$ANALYSIS_RESULT" = "cancelled" ]; then
            echo "Scorecard analysis did not complete successfully."
            exit 1
          fi
          if [ "$ANALYSIS_RESULT" = "success" ] && [ "$POLICY_OUTCOME" != "success" ]; then
            echo "Scorecard results violate the committed policy."
            exit 1
          fi
          if [ "$ANALYSIS_RESULT" = "skipped" ]; then
            echo "Scorecard analysis is unsupported for fork pull requests; local Scorecard controls were validated instead."
          fi
