name: OpenSSF Scorecard

on:
  branch_protection_rule:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "29 9 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard Analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      checks: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard for code-scanning alerts
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Run OpenSSF Scorecard for exact score evidence
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: false

      - name: Upload Scorecard evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenSSF-Scorecard-${{ github.run_id }}
          path: |
            results.sarif
            results.json
          if-no-files-found: error
          retention-days: 5

      - name: Upload Scorecard results to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif

  policy:
    name: Scorecard Policy
    if: always()
    needs:
      - analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate local Scorecard controls
        run: node scripts/check-repo.mjs

      - name: Download Scorecard evidence
        if: needs.analysis.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenSSF-Scorecard-${{ github.run_id }}

      - name: Evaluate Scorecard results against policy
        id: scorecard-policy
        if: needs.analysis.result == 'success'
        continue-on-error: true
        env:
          SCORECARD_POLICY_PROFILE: ${{ github.event_name == 'pull_request' && 'pull-request' || 'repository' }}
        run: >-
          node scripts/check-scorecard-sarif.mjs
          results.sarif
          .github/scorecard-policy.json
          scorecard-policy-report.json
          "$SCORECARD_POLICY_PROFILE"
          results.json

      - name: Upload Scorecard policy report
        if: always() && needs.analysis.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OpenSSF-Scorecard-Policy-${{ github.run_id }}
          path: scorecard-policy-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Scorecard policy
        if: always()
        env:
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          POLICY_OUTCOME: ${{ steps.scorecard-policy.outcome }}
        run: |
          if [ "$ANALYSIS_RESULT" = "failure" ] || [ "$ANALYSIS_RESULT" = "cancelled" ]; then
            echo "Scorecard analysis did not complete successfully."
            exit 1
          fi
          if [ "$ANALYSIS_RESULT" = "success" ] && [ "$POLICY_OUTCOME" != "success" ]; then
            echo "Scorecard results violate the committed policy."
            exit 1
          fi
          if [ "$ANALYSIS_RESULT" = "skipped" ]; then
            echo "Scorecard analysis is unsupported for fork pull requests; local Scorecard controls were validated instead."
          fi
